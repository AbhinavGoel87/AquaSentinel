<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kshetra</title>
  <link rel="stylesheet" href="/static/css/app.css?v=14">
</head>
<body>
  <div class="sheet">
    <header class="mast">
      <p class="devanagari" lang="hi">क्षेत्र</p>
      <h1>Kshetra</h1>
    </header>

    <p class="error" id="error" hidden></p>

    <main>
      <section class="reading">
        <div class="reading-copy">
          <h2>Doctor</h2>
          <p>The ESP32-CAM posts a JPEG over Wi-Fi, or you can choose a photo here. The result is a color match to the example pictures, not a lab test.</p>
          <img id="doctor-photo" alt="Latest plant photo" hidden>
          <form id="photo-form" class="controls">
            <label>Leaf photo
              <input id="photo-file" type="file" accept="image/png,image/jpeg" required>
            </label>
            <button type="submit" class="btn">Check this photo</button>
          </form>
        </div>
        <div id="doctor"></div>
      </section>
    </main>
  </div>
  <script src="/static/js/doctor.js?v=10"></script>
</body>
</html>
